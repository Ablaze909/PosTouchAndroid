# Compila l'APK Android a ogni push sul ramo main (e su richiesta dalla scheda Actions).
# L'APK si scarica dalla pagina della build (sezione "Artifacts") e, per i tag v*, dalla pagina Releases.
name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# due push ravvicinati: una build alla volta, così il ramo apk non viene sovrascritto da quella più vecchia
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Password della chiave di firma (keystore/postouch.keystore).
      # Repository privato: per più sicurezza spostarla in un Secret e usare ${{ secrets.POSTOUCH_KEY_PASS }}
      POSTOUCH_KEY_PASS: E2hRPUAcKDEESZOoNNqdJnWP
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Test automatici della logica: se uno fallisce l'APK NON viene prodotto
      - name: Test automatici
        run: dotnet run --project tests/PosTouch.Tests/PosTouch.Tests.csproj -c Release

      - name: Installa workload Android
        run: dotnet workload install maui-android

      - name: Installa componenti Android SDK
        run: >
          dotnet build src/PosTouch.App/PosTouch.App.csproj -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT
          -p:AcceptAndroidSDKLicenses=True

      - name: Compila APK
        run: >
          dotnet publish src/PosTouch.App/PosTouch.App.csproj
          -f net10.0-android -c Release
          -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT
          -p:ApplicationVersion=${{ github.run_number }}
          -o out

      - name: Rinomina APK
        run: |
          APK=$(ls out/*-Signed.apk | head -n 1)
          mkdir -p dist
          cp "$APK" "dist/POS_Touch_Android_b${{ github.run_number }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: POS_Touch_Android_b${{ github.run_number }}
          path: dist/*.apk

      # Copia l'ultimo APK nel ramo "apk" (scaricabile anche senza aprire Actions)
      - name: Pubblica APK nel ramo apk
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp *.apk POS_Touch_Android_ultimo.apk
          git add *.apk
          git commit -q -m "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Pubblica release (solo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
